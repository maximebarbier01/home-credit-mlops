name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "2.3.4"
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: poetry-${{ runner.os }}-py3.11-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint (ruff)
        run: poetry run ruff check scripts src tests

      - name: Tests (pytest)
        run: poetry run pytest -q

  build-and-deploy:
    # Environnement cible "simule" (au sens de la consigne) : le conteneur
    # est construit puis reellement lance et interroge dans le runner
    # GitHub Actions, y compris un vrai telechargement du modele depuis
    # Hugging Face Hub (depot public, aucun secret requis). Le deploiement
    # sur une plateforme externe (Hugging Face Spaces) n'est pas fait ici :
    # l'hebergement Docker/Gradio y necessite un abonnement PRO sur le tier
    # gratuit "cpu-basic" (erreur 402 constatee), ce qui sort du perimetre
    # de ce projet pedagogique.
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: home-credit-scoring-api:${{ github.sha }}

      - name: Run container (target environment)
        run: |
          docker run -d --name credit-api -p 8000:7860 \
            -e HF_TOKEN="${{ secrets.HF_TOKEN }}" \
            home-credit-scoring-api:${{ github.sha }}

      - name: Wait for the API to become healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health | grep -q '"model_loaded":true'; then
              echo "API healthy"
              exit 0
            fi
            sleep 5
          done
          echo "API did not become healthy in time"
          exit 1

      - name: Smoke test /predict against the real published model
        run: |
          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d @tests/fixtures/sample_predict_payload.json \
            | tee /tmp/predict_response.json
          python3 -c "
          import json
          body = json.load(open('/tmp/predict_response.json'))
          assert 'credit_decision' in body, body
          assert 'default_probability' in body, body
          print('Smoke test OK:', body)
          "

      - name: Show container logs on failure
        if: failure()
        run: docker logs credit-api

      - name: Stop container
        if: always()
        run: docker rm -f credit-api || true
