services:
  postgres:
    image: postgres:16-alpine
    container_name: home-credit-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-home_credit_monitoring}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant, voir .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant, voir .env.example}
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: home-credit-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      API_CALL_LOGGING_ENABLED: "true"
      PREDICTION_LOGGING_ENABLED: "true"
      PREDICTION_DB_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER manquant, voir .env.example}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant, voir .env.example}@postgres:5432/${POSTGRES_DB:-home_credit_monitoring}
    ports:
      - "8000:7860"
    volumes:
      - hf_model_cache:/app/artifacts/hf_model_cache

volumes:
  postgres_data:
  hf_model_cache:
