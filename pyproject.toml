[project]
name = "home-credit-mlops"
version = "0.1.0"
description = "Credit scoring project with MLflow tracking and a script-first MLOps workflow"
authors = [
    { name = "Maxime", email = "maximebarbier57@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<3.0",
    "pyarrow>=16,<21",
    "scikit-learn>=1.5,<2.0",
    "mlflow>=2.14,<4.0",
    "lightgbm (>=4.6.0,<5.0.0)",
    "uvicorn (>=0.49.0,<0.50.0)",
    "imbalanced-learn (>=0.14.2,<0.15.0)",
    "xgboost (>=3.1,<4.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "home_credit_mlops", from = "src" },
    { include = "app" },
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.0"
ruff = "^0.12.0"
ipykernel = "^7.3.0"
httpx2 = "^2.10.0"

[tool.poetry.group.reporting.dependencies]
matplotlib = ">=3.9,<4.0"
seaborn = ">=0.13,<1.0"
shap = "0.51.0"
missingno = ">=0.5.2,<0.6.0"
openpyxl = ">=3.1.5,<4.0.0"
streamlit = "^1.61.1"

[tool.poetry.group.api.dependencies]
fastapi = ">=0.138,<1.0"
huggingface-hub = ">=1.20,<2.0"
pydantic = ">=2.13,<3.0"
sqlalchemy = ">=2.0,<3.0"
psycopg = {version = ">=3.2,<4.0", extras = ["binary"]}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
